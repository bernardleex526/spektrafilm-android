[package]
name = "spektrafilm-jni"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
publish = false

[lib]
name = "spektrafilm_jni"
crate-type = ["cdylib", "rlib"]

[dependencies]
spektrafilm-core = { path = "../../third_party/spektrafilm-rs/crates/spektrafilm-core" }
spektrafilm-gpu = { path = "../../third_party/spektrafilm-rs/crates/spektrafilm-gpu" }
spektrafilm-math = { path = "../../third_party/spektrafilm-rs/crates/spektrafilm-math" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"
log = "0.4"
rawler = "0.7"
rayon = "1.10"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

# Desktop Linux test host only: link the distro OpenBLAS instead of building it from source.
[target.'cfg(target_os = "linux")'.dependencies]
openblas-src = { version = "0.10", default-features = false, features = ["cblas", "system"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "unwind"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
